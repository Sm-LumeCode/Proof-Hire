<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ProofHire · Skill Graph</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --surface2: #1a1e2a;
    --border: rgba(255,255,255,0.07);
    --text: #e8eaf0;
    --muted: #7a7f94;
    --matched: #00d68f;
    --matched-dim: rgba(0,214,143,0.15);
    --missing: #ff4d6d;
    --missing-dim: rgba(255,77,109,0.15);
    --extra: #4d9fff;
    --extra-dim: rgba(77,159,255,0.15);
    --domain: #5c6280;
    --domain-dim: rgba(92,98,128,0.12);
    --gap-edge: #ff4d6d;
    --norm-edge: rgba(255,255,255,0.12);
    --accent: #7c5cfc;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 300px 1fr;
    grid-template-areas: "header header" "sidebar canvas";
  }

  /* ── Header ── */
  header {
    grid-area: header;
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .fit-badge {
    display: flex; align-items: center; gap: 12px;
  }
  .fit-score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 28px; font-weight: 500;
    color: var(--missing);
  }
  .fit-score.good { color: var(--matched); }
  .fit-score.partial { color: #ffb347; }
  .fit-grade {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); font-family: 'IBM Plex Mono', monospace;
  }

  /* ── Sidebar ── */
  aside {
    grid-area: sidebar;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 20px;
  }

  .section-title {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 10px;
  }

  /* stat row */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat-card {
    background: var(--surface2); border-radius: 8px; padding: 10px 8px;
    text-align: center; border: 1px solid var(--border);
  }
  .stat-num { font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
  .stat-num.green { color: var(--matched); }
  .stat-num.red { color: var(--missing); }
  .stat-num.blue { color: var(--extra); }
  .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* legend */
  .legend { display: flex; flex-direction: column; gap: 8px; }
  .leg-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .leg-line { width: 24px; height: 2px; flex-shrink: 0; }

  /* gaps list */
  .gap-list { display: flex; flex-direction: column; gap: 8px; }
  .gap-item {
    background: var(--surface2); border-radius: 8px; padding: 10px 12px;
    border-left: 3px solid var(--missing);
  }
  .gap-item.medium { border-left-color: #ffb347; }
  .gap-item.low { border-left-color: var(--extra); }
  .gap-name { font-size: 13px; font-weight: 600; }
  .gap-meta { font-size: 11px; color: var(--muted); margin-top: 4px; font-family: 'IBM Plex Mono', monospace; }
  .gap-bar-wrap { background: rgba(255,255,255,0.06); border-radius: 3px; height: 3px; margin-top: 8px; }
  .gap-bar { height: 3px; border-radius: 3px; background: var(--missing); }
  .gap-item.medium .gap-bar { background: #ffb347; }
  .gap-item.low .gap-bar { background: var(--extra); }

  /* learning path */
  .path-chain { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .path-node {
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    background: var(--surface2); border: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
  }
  .path-arrow { color: var(--muted); font-size: 11px; }

  /* tooltip */
  #tooltip {
    position: fixed; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; pointer-events: none;
    opacity: 0; transition: opacity 0.15s; z-index: 100;
    min-width: 180px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #tooltip .tip-name { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  #tooltip .tip-status {
    display: inline-block; font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase; padding: 2px 7px; border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace; margin-bottom: 10px;
  }
  #tooltip .tip-row { display: flex; justify-content: space-between; gap: 20px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  #tooltip .tip-row span:last-child { font-family: 'IBM Plex Mono', monospace; color: var(--text); }

  /* canvas area */
  #canvas-wrap {
    grid-area: canvas; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 60% 40%, rgba(124,92,252,0.04) 0%, transparent 70%);
  }
  canvas { display: block; }

  /* controls */
  #controls {
    position: absolute; bottom: 16px; right: 16px;
    display: flex; gap: 6px;
  }
  .ctrl-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 16px;
    transition: background 0.15s;
  }
  .ctrl-btn:hover { background: var(--surface2); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .narrative {
    font-size: 12px; color: var(--muted); line-height: 1.7;
    padding: 10px 12px; background: var(--surface2); border-radius: 8px;
    border: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <div class="logo">Proof<span>Hire</span> · Skill Graph</div>
  <div class="fit-badge">

  <div>

  </div>
</aside>

<div id="canvas-wrap">

  <div id="controls">
    <button class="ctrl-btn" id="btn-zoom-in" title="Zoom in">+</button>
    <button class="ctrl-btn" id="btn-zoom-out" title="Zoom out">−</button>

</div>

// Viewport transform

let W, H;

  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(devicePixelRatio, devicePixelRatio);
  draw();
}

function nodeRadius(n) { return Math.max(10, 8 + Math.sqrt(n.downstream_count) * 3); }

function toScreen(nx, ny) {
  return [nx * W * scale + tx, ny * H * scale + ty];
}

let hoveredNode = null;

function draw() {
  ctx.clearRect(0, 0, W, H);

  // grid dots
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let gx = 0; gx < W; gx += 40) for (let gy = 0; gy < H; gy += 40) {
    ctx.beginPath(); ctx.arc(gx, gy, 1, 0, Math.PI*2); ctx.fill();
  }

  // edges

    const a = byId[e.source], b = byId[e.target];
    if (!a || !b) return;
    const [ax, ay] = toScreen(a.px, a.py);
    const [bx, by] = toScreen(b.px, b.py);

    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.strokeStyle = e.is_gap_path ? 'rgba(255,77,109,0.6)' : 'rgba(255,255,255,0.1)';
    ctx.lineWidth = e.is_gap_path ? 1.5 : 0.8;
    if (e.is_gap_path) ctx.setLineDash([5, 4]);
    else ctx.setLineDash([]);
    ctx.stroke();
    ctx.setLineDash([]);

    // arrowhead
    const rb = nodeRadius(b) * scale;
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
    if (len < 1) return;
    const ex = bx - dx/len * (rb + 2), ey = by - dy/len * (rb + 2);
    const aw = 4, ah = dx/len * 4;
    ctx.beginPath();
    ctx.moveTo(ex - dx/len * 8 + (-dy/len * aw), ey - dy/len * 8 + (dx/len * aw));
    ctx.lineTo(ex, ey);
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - dx/len * 8 - (-dy/len * aw), ey - dy/len * 8 - (dx/len * aw));
    ctx.strokeStyle = e.is_gap_path ? 'rgba(255,77,109,0.7)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // nodes
  nodes.forEach(n => {
    const [sx, sy] = toScreen(n.px, n.py);
    const r = nodeRadius(n) * scale;
    const isH = hoveredNode && hoveredNode.id === n.id;

    // glow for key nodes
    if (n.status === 'MATCHED' || n.status === 'MISSING') {
      ctx.beginPath();
      ctx.arc(sx, sy, r + 8 * scale, 0, Math.PI*2);
      const grd = ctx.createRadialGradient(sx,sy,r*0.5,sx,sy,r+8*scale);
      const c = n.status === 'MATCHED' ? '0,214,143' : '255,77,109';
      grd.addColorStop(0, `rgba(${c},0.2)`);
      grd.addColorStop(1, `rgba(${c},0)`);
      ctx.fillStyle = grd;
      ctx.fill();
    }

    if (isH) {
      ctx.beginPath();
      ctx.arc(sx, sy, r + 6 * scale, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI*2);
    ctx.fillStyle = COLOR[n.status] || '#3d4260';
    ctx.fill();
    ctx.strokeStyle = isH ? '#fff' : (STROKE_C[n.status] || '#5c6280');
    ctx.lineWidth = isH ? 2 : 0.8;
    ctx.stroke();

    // label
    const fontSize = Math.max(9, Math.min(13, 11 * scale));
    ctx.font = `${n.status === 'MATCHED' || n.status === 'MISSING' ? '600' : '400'} ${fontSize}px 'IBM Plex Mono',monospace`;
    ctx.textAlign = 'center';
    const labelY = sy + r + 4 * scale + fontSize;
    const tw = ctx.measureText(n.label).width;
    ctx.fillStyle = 'rgba(13,15,20,0.75)';
    ctx.fillRect(sx - tw/2 - 3, labelY - fontSize, tw + 6, fontSize + 2);
    ctx.fillStyle = isH ? COLOR[n.status] : (n.status === 'DOMAIN' ? 'rgba(200,204,220,0.5)' : 'rgba(200,204,220,0.85)');
    ctx.fillText(n.label, sx, labelY);
  });
}

// hover
function getNode(mx, my) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const [sx, sy] = toScreen(n.px, n.py);
    const r = nodeRadius(n) * scale;
    if (Math.hypot(mx - sx, my - sy) <= r + 4) return n;
  }
  return null;
}

const tip = document.getElementById('tooltip');
const statusLabel = { MATCHED: '✓ Matched', MISSING: '✗ Missing', EXTRA: '+ Extra', DOMAIN: '◦ Context' };
const statusBg = { MATCHED: 'rgba(0,214,143,0.15)', MISSING: 'rgba(255,77,109,0.15)', EXTRA: 'rgba(77,159,255,0.15)', DOMAIN: 'rgba(92,98,128,0.15)' };
const statusColor = { MATCHED: '#00d68f', MISSING: '#ff4d6d', EXTRA: '#4d9fff', DOMAIN: '#7a7f94' };

canvas.addEventListener('mousemove', ev => {
  const r = canvas.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const n = getNode(mx, my);
  hoveredNode = n;
  draw();
  if (n) {
    canvas.style.cursor = 'pointer';
    tip.style.opacity = '1';
    let lx = ev.clientX + 16, ly = ev.clientY - 10;
    if (lx + 200 > window.innerWidth) lx = ev.clientX - 220;
    tip.style.left = lx + 'px'; tip.style.top = ly + 'px';
    const sl = statusLabel[n.status] || n.status;
    const sc = statusColor[n.status] || '#7a7f94';
    const sbg = statusBg[n.status] || 'rgba(92,98,128,0.15)';
    tip.innerHTML = `
      <div class="tip-name">${n.label}</div>
      <div class="tip-status" style="background:${sbg};color:${sc}">${sl}</div>
      <div class="tip-row"><span>Impact score</span><span>${(n.impact_score*100).toFixed(1)}%</span></div>
      <div class="tip-row"><span>Learnability</span><span>${(n.learnability*100).toFixed(0)}%</span></div>
      <div class="tip-row"><span>Downstream</span><span>${n.downstream_count} skills</span></div>
      <div class="tip-row"><span>Centrality</span><span>${n.centrality.toFixed(3)}</span></div>`;
  } else {
    canvas.style.cursor = 'default';
    tip.style.opacity = '0';
  }
});
canvas.addEventListener('mouseleave', () => { hoveredNode = null; tip.style.opacity = '0'; draw(); });

// pan
canvas.addEventListener('mousedown', ev => { dragging = true; lastX = ev.clientX; lastY = ev.clientY; canvas.style.cursor = 'grab'; });
window.addEventListener('mouseup', () => { dragging = false; canvas.style.cursor = hoveredNode ? 'pointer' : 'default'; });
window.addEventListener('mousemove', ev => {
  if (!dragging) return;
  tx += ev.clientX - lastX; ty += ev.clientY - lastY;
  lastX = ev.clientX; lastY = ev.clientY;
  draw();
});

// zoom
canvas.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = canvas.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const delta = ev.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.min(4, Math.max(0.3, scale * delta));
  tx = mx - (mx - tx) * (newScale / scale);
  ty = my - (my - ty) * (newScale / scale);
  scale = newScale;
  draw();
}, { passive: false });

// touch pan
let lastTouch = null;
canvas.addEventListener('touchstart', ev => { if (ev.touches.length === 1) lastTouch = { x: ev.touches[0].clientX, y: ev.touches[0].clientY }; });
canvas.addEventListener('touchmove', ev => {
  ev.preventDefault();
  if (ev.touches.length === 1 && lastTouch) {
    tx += ev.touches[0].clientX - lastTouch.x;
    ty += ev.touches[0].clientY - lastTouch.y;
    lastTouch = { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
    draw();
  }
}, { passive: false });

// buttons
document.getElementById('btn-zoom-in').onclick = () => { scale = Math.min(4, scale * 1.2); draw(); };
document.getElementById('btn-zoom-out').onclick = () => { scale = Math.max(0.3, scale * 0.8); draw(); };
document.getElementById('btn-reset').onclick = () => { scale = 1; tx = 0; ty = 0; draw(); };

resize();
</script>
</body>
</html>
