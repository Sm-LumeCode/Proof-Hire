<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skill Knowledge Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0c10;
    color: #e2e8f0;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 24px;
    background: #10141a;
    border-bottom: 1px solid #1e2530;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  header h1 { font-size: 1rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #f59e0b; }
  .legend { display: flex; gap: 16px; margin-left: auto; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; color: #64748b; text-transform: uppercase; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  #score-display {
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 4px;
    background: rgba(245,158,11,0.12);
    border: 1px solid rgba(245,158,11,0.3);
    color: #f59e0b;
    letter-spacing: 0.05em;
  }
  #graph-wrap { flex: 1; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; }
  #tooltip {
    position: absolute;
    pointer-events: none;
    background: #10141a;
    border: 1px solid #1e2530;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.78rem;
    max-width: 220px;
    line-height: 1.6;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 10;
  }
  #tooltip strong { font-size: 0.9rem; display: block; margin-bottom: 4px; }
  #tooltip .tt-score { font-weight: 700; font-size: 1rem; }
  #tooltip .tt-reason { color: #64748b; font-size: 0.7rem; margin-top: 3px; }
  .controls {
    padding: 12px 24px;
    background: #10141a;
    border-top: 1px solid #1e2530;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .ctrl-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 200px; }
  .ctrl-group label { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #64748b; }
  .ctrl-group input {
    background: #0a0c10;
    border: 1px solid #1e2530;
    border-radius: 5px;
    color: #e2e8f0;
    padding: 7px 10px;
    font-size: 0.82rem;
    outline: none;
    font-family: monospace;
    transition: border-color 0.2s;
  }
  .ctrl-group input:focus { border-color: #f59e0b; }
  button {
    background: #f59e0b;
    color: #0a0c10;
    border: none;
    border-radius: 5px;
    padding: 8px 20px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    text-transform: uppercase;
    align-self: flex-end;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  button:hover { background: #fbbf24; }
</style>
</head>
<body>

<header>
  <h1>Skill Knowledge Graph</h1>
  <span id="score-display">FIT SCORE: —</span>
  <div class="legend">
    <div class="legend-item"><div class="dot" style="background:#f59e0b"></div>Center</div>
    <div class="legend-item"><div class="dot" style="background:#22c55e"></div>Matched</div>
    <div class="legend-item"><div class="dot" style="background:#94a3b8"></div>Related</div>
    <div class="legend-item"><div class="dot" style="background:#ef4444"></div>Gap</div>
  </div>
</header>

<div id="graph-wrap">
  <svg id="graph"></svg>
  <div id="tooltip"></div>
</div>

<div class="controls" style="display:none;">
  <div class="ctrl-group">
    <label>Candidate Skills (comma separated)</label>
    <input id="inp-candidate" value="Flask, PostgreSQL, React, Docker" />
  </div>
  <div class="ctrl-group">
    <label>Required Skills (comma separated)</label>
    <input id="inp-required" value="Python, SQL, JavaScript, Kubernetes, Django" />
  </div>
  <div class="ctrl-group" style="min-width:120px;flex:0">
    <label>Groq API Key</label>
    <input id="inp-apikey" type="password" placeholder="gsk_..." />
  </div>
  <button onclick="runGraph()">Build Graph</button>
</div>

<script>
// ── Helpers ──────────────────────────────────────────────────────────────────

function normalize(s) {
  return s.toLowerCase().replace(/[^a-z0-9.#+\s]/g, '').trim();
}

async function queryLLM(candidateSkill, requiredSkills, apiKey) {
  const skillList = requiredSkills.join(', ');
  const prompt = `You are a technical skill expert.

Given that a candidate knows: "${candidateSkill}"
And the job requires these skills: [${skillList}]

For each required skill, determine if knowing "${candidateSkill}" implies or demonstrates knowledge of that required skill.
Only include skills where there is a genuine technical implication (e.g., knowing Flask implies Python).
Do NOT include skills that are unrelated.

Respond ONLY with a valid JSON array. No explanation, no markdown, no extra text.
Format:
[
  {"skill": "required_skill_name", "confidence": 0.95, "reason": "brief reason"},
  ...
]

If "${candidateSkill}" implies nothing from the list, return an empty array: []`;

  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`
    },
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      messages: [{ role: 'user', content: prompt }],
      temperature: 0,
      max_tokens: 1000
    })
  });

  const data = await res.json();
  let text = data.choices?.[0]?.message?.content?.trim() || '[]';
  text = text.replace(/```json|```/g, '').trim();
  try { return JSON.parse(text); }
  catch { return []; }
}

// ── Semantic similarity (cosine over char n-gram vectors, no external model) ─
function ngramVector(str, n = 3) {
  const s = ' ' + str.toLowerCase() + ' ';
  const freq = {};
  for (let i = 0; i <= s.length - n; i++) {
    const g = s.slice(i, i + n);
    freq[g] = (freq[g] || 0) + 1;
  }
  return freq;
}

function cosineSim(a, b) {
  const va = ngramVector(a), vb = ngramVector(b);
  const keys = new Set([...Object.keys(va), ...Object.keys(vb)]);
  let dot = 0, na = 0, nb = 0;
  for (const k of keys) {
    dot += (va[k] || 0) * (vb[k] || 0);
    na  += (va[k] || 0) ** 2;
    nb  += (vb[k] || 0) ** 2;
  }
  return na && nb ? dot / (Math.sqrt(na) * Math.sqrt(nb)) : 0;
}

// ── Main pipeline ─────────────────────────────────────────────────────────────

async function buildGraphData(candidateSkills, requiredSkills, apiKey) {
  const normReq = requiredSkills.map(normalize);
  const implications = {};

  for (const cand of candidateSkills) {
    const nc = normalize(cand);
    let results = [];
    if (apiKey) {
      results = await queryLLM(cand, requiredSkills, apiKey);
    }
    implications[nc] = results;
  }

  // Compute best score per required skill
  const breakdown = [];
  for (let i = 0; i < requiredSkills.length; i++) {
    const req = requiredSkills[i];
    const nr  = normReq[i];
    let best = { score: 0, reason: 'no match', match: null };

    for (const cand of candidateSkills) {
      const nc = normalize(cand);

      // Exact
      if (nc === nr) {
        if (1.0 > best.score) best = { score: 1.0, reason: 'exact match', match: cand };
        continue;
      }

      // LLM implication
      const imp = (implications[nc] || []).find(x => normalize(x.skill) === nr);
      if (imp && imp.confidence > best.score) {
        best = { score: imp.confidence, reason: imp.reason || 'LLM implication', match: cand };
        continue;
      }

      // Semantic fallback
      const sem = cosineSim(nc, nr);
      if (sem >= 0.72 && sem > best.score) {
        best = { score: sem, reason: `semantically similar (${(sem*100).toFixed(0)}%)`, match: cand };
      }
    }

    breakdown.push({ req, nr, ...best });
  }

  const overall = breakdown.reduce((s, b) => s + b.score, 0) / breakdown.length * 100;

  // Build nodes & links
  const nodes = [];
  const links = [];

  // Center node
  nodes.push({ id: '__center__', label: 'ROLE', type: 'center', score: null, reason: '' });

  // Required skill nodes
  for (const b of breakdown) {
    const type = b.score >= 0.75 ? 'matched' : b.score >= 0.4 ? 'related' : 'gap';
    nodes.push({ id: b.nr, label: b.req, type, score: b.score, reason: b.reason, matchedWith: b.match });
    links.push({ source: '__center__', target: b.nr, type: 'center-req' });
  }

  // Candidate skill nodes that have at least one implication
  const addedCand = new Set();
  for (const cand of candidateSkills) {
    const nc = normalize(cand);
    const imps = implications[nc] || [];
    for (const imp of imps) {
      const nr = normalize(imp.skill);
      if (normReq.includes(nr)) {
        if (!addedCand.has(nc)) {
          nodes.push({ id: nc, label: cand, type: 'candidate', score: null, reason: '' });
          addedCand.add(nc);
        }
        links.push({ source: nc, target: nr, type: 'implication', confidence: imp.confidence, reason: imp.reason });
      }
    }
  }

  return { nodes, links, overall, breakdown };
}

// ── D3 Rendering ──────────────────────────────────────────────────────────────

const COLOR = {
  center:    '#f59e0b',
  matched:   '#22c55e',
  related:   '#94a3b8',
  gap:       '#ef4444',
  candidate: '#94a3b8',
};

const GLOW = {
  center:    'rgba(245,158,11,0.35)',
  matched:   'rgba(34,197,94,0.3)',
  related:   'rgba(148,163,184,0.2)',
  gap:       'rgba(239,68,68,0.3)',
  candidate: 'rgba(148,163,184,0.15)',
};

const RADIUS = {
  center:    38,
  matched:   26,
  related:   22,
  gap:       22,
  candidate: 18,
};

function renderGraph(data) {
  const { nodes, links, overall, breakdown } = data;
  document.getElementById('score-display').textContent = `FIT SCORE: ${overall.toFixed(1)}/100`;

  const wrap = document.getElementById('graph-wrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;

  d3.select('#graph').selectAll('*').remove();

  const svg = d3.select('#graph')
    .attr('viewBox', `0 0 ${W} ${H}`);

  // Defs: glow filters + arrowhead
  const defs = svg.append('defs');

  for (const [type, col] of Object.entries(GLOW)) {
    const f = defs.append('filter').attr('id', `glow-${type}`).attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
    f.append('feGaussianBlur').attr('stdDeviation', '6').attr('result', 'blur');
    f.append('feFlood').attr('flood-color', col).attr('flood-opacity', '1').attr('result', 'color');
    f.append('feComposite').attr('in', 'color').attr('in2', 'blur').attr('operator', 'in').attr('result', 'shadow');
    const merge = f.append('feMerge');
    merge.append('feMergeNode').attr('in', 'shadow');
    merge.append('feMergeNode').attr('in', 'SourceGraphic');
  }

  defs.append('marker')
    .attr('id', 'arrow')
    .attr('viewBox', '0 -4 8 8')
    .attr('refX', 8).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path').attr('d', 'M0,-4L8,0L0,4').attr('fill', '#94a3b8').attr('opacity', 0.5);

  const g = svg.append('g');

  // Zoom
  svg.call(d3.zoom().scaleExtent([0.3, 3]).on('zoom', e => g.attr('transform', e.transform)));

  // Force simulation
  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(d => {
      if (d.type === 'center-req') return 160;
      return 110;
    }).strength(0.9))
    .force('charge', d3.forceManyBody().strength(-400))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide().radius(d => RADIUS[d.type] + 20));

  // Links
  const link = g.append('g').selectAll('line')
    .data(links).enter().append('line')
    .attr('stroke', d => d.type === 'implication' ? 'rgba(148,163,184,0.4)' : 'rgba(245,158,11,0.15)')
    .attr('stroke-width', d => d.type === 'implication' ? 1.5 : 1)
    .attr('stroke-dasharray', d => d.type === 'implication' ? '4,3' : null)
    .attr('marker-end', d => d.type === 'implication' ? 'url(#arrow)' : null);

  // Node groups
  const node = g.append('g').selectAll('g')
    .data(nodes).enter().append('g')
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end',   (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
    );

  // Glow circle
  node.append('circle')
    .attr('r', d => RADIUS[d.type] + 8)
    .attr('fill', d => GLOW[d.type])
    .attr('opacity', 0.6);

  // Main circle
  node.append('circle')
    .attr('r', d => RADIUS[d.type])
    .attr('fill', d => {
      if (d.type === 'center') return '#1a1f2e';
      if (d.type === 'candidate') return '#161b24';
      return '#0f1318';
    })
    .attr('stroke', d => COLOR[d.type])
    .attr('stroke-width', d => d.type === 'center' ? 3 : 2)
    .style('filter', d => `url(#glow-${d.type})`);

  // Label
  node.append('text')
    .text(d => d.label)
    .attr('text-anchor', 'middle')
    .attr('dy', '0.35em')
    .attr('fill', d => d.type === 'candidate' ? '#94a3b8' : COLOR[d.type])
    .attr('font-size', d => {
      if (d.type === 'center') return '11px';
      const len = d.label.length;
      if (len > 10) return '8px';
      if (len > 7)  return '9px';
      return '10px';
    })
    .attr('font-weight', '700')
    .attr('letter-spacing', '0.04em')
    .attr('font-family', 'monospace');

  // Score badge on required nodes
  node.filter(d => d.score !== null && d.type !== 'candidate')
    .append('text')
    .text(d => `${(d.score * 100).toFixed(0)}%`)
    .attr('text-anchor', 'middle')
    .attr('dy', d => RADIUS[d.type] + 14)
    .attr('fill', d => COLOR[d.type])
    .attr('font-size', '8px')
    .attr('font-weight', '700')
    .attr('font-family', 'monospace')
    .attr('opacity', 0.8);

  // Tooltip
  const tooltip = document.getElementById('tooltip');
  node.on('mouseover', (event, d) => {
    if (d.type === 'center') return;
    let html = `<strong style="color:${COLOR[d.type]}">${d.label}</strong>`;
    if (d.score !== null) {
      html += `<div class="tt-score" style="color:${COLOR[d.type]}">${(d.score*100).toFixed(1)}% match</div>`;
    }
    if (d.matchedWith) html += `<div style="color:#94a3b8;font-size:0.72rem">via <b style="color:#e2e8f0">${d.matchedWith}</b></div>`;
    if (d.reason)      html += `<div class="tt-reason">${d.reason}</div>`;
    if (d.type === 'gap') html += `<div style="color:#ef4444;font-size:0.7rem;margin-top:4px">⚠ Skill Gap</div>`;
    tooltip.innerHTML = html;
    tooltip.style.opacity = '1';
  })
  .on('mousemove', event => {
    const rect = document.getElementById('graph-wrap').getBoundingClientRect();
    let x = event.clientX - rect.left + 14;
    let y = event.clientY - rect.top - 14;
    if (x + 240 > rect.width) x -= 260;
    tooltip.style.left = x + 'px';
    tooltip.style.top  = y + 'px';
  })
  .on('mouseout', () => { tooltip.style.opacity = '0'; });

  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => {
        const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        return d.target.x - (dx / dist) * (RADIUS[d.target.type] + 8);
      })
      .attr('y2', d => {
        const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        return d.target.y - (dy / dist) * (RADIUS[d.target.type] + 8);
      });

    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

// ── Entry point ───────────────────────────────────────────────────────────────

async function runGraph() {
  const candidateSkills = document.getElementById('inp-candidate').value.split(',').map(s => s.trim()).filter(Boolean);
  const requiredSkills  = document.getElementById('inp-required').value.split(',').map(s => s.trim()).filter(Boolean);
  const apiKey          = document.getElementById('inp-apikey').value.trim();

  document.getElementById('score-display').textContent = 'Building…';

  try {
    const data = await buildGraphData(candidateSkills, requiredSkills, apiKey);
    renderGraph(data);
  } catch(e) {
    console.error(e);
    document.getElementById('score-display').textContent = 'Error — check console';
  }
}

// Run with defaults on load (no LLM key, semantic only)
window.addEventListener('load', () => {
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('candidate')) document.getElementById('inp-candidate').value = urlParams.get('candidate');
  if (urlParams.has('required')) document.getElementById('inp-required').value = urlParams.get('required');
  if (urlParams.has('apikey')) document.getElementById('inp-apikey').value = urlParams.get('apikey');
  runGraph();
});
</script>
</body>
</html>
