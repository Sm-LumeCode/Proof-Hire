<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Parser</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; min-height: 100vh; padding: 2rem; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin-bottom: 1.5rem; }
  .api-row { display: flex; gap: 10px; margin-bottom: 1rem; }
  .api-row input {
    flex: 1; padding: 0.6rem 1rem; border: 1px solid #ccc;
    border-radius: 8px; font-size: 0.9rem;
  }
  .upload-area {
    width: 100%; border: 2px dashed #ccc; border-radius: 10px;
    padding: 2rem; text-align: center; margin-bottom: 1rem;
    background: #fff; cursor: pointer; transition: border-color 0.2s;
  }
  .upload-area:hover { border-color: #555; }
  .upload-area input[type="file"] { display: none; }
  .upload-area label { cursor: pointer; font-size: 0.9rem; color: #555; }
  .file-name { font-size: 0.82rem; color: #2a9d5c; margin-top: 0.5rem; }
  button {
    padding: 0.65rem 1.5rem; background: #111; color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { font-size: 0.85rem; color: #666; margin: 0.75rem 0; }
  .results { display: none; }
  .card {
    background: #fff; border-radius: 10px; padding: 1.25rem;
    margin-bottom: 1rem; border: 1px solid #e5e5e5;
  }
  .card-label {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: #999; margin-bottom: 0.75rem;
  }
  .name { font-size: 1.8rem; font-weight: 700; }
  .cgpa-val { font-size: 2.5rem; font-weight: 700; color: #2a9d5c; }
  .skills-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    background: #f0f0f0; border-radius: 20px; padding: 4px 12px;
    font-size: 0.8rem;
  }
  .url-list { display: flex; flex-direction: column; gap: 8px; }
  .url-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: #f8f8f8; border-radius: 8px;
    text-decoration: none; color: #111; font-size: 0.85rem; word-break: break-all;
  }
  .badge {
    font-size: 0.65rem; padding: 2px 8px; border-radius: 4px;
    font-weight: 600; flex-shrink: 0;
  }
  .badge-linkedin  { background: #dbeafe; color: #1d4ed8; }
  .badge-github    { background: #dcfce7; color: #15803d; }
  .badge-portfolio { background: #fce7f3; color: #9d174d; }
  .badge-other     { background: #f3f4f6; color: #555; }
  .ach-list { display: flex; flex-direction: column; }
  .ach-item {
    display: flex; gap: 10px; padding: 9px 0;
    border-bottom: 1px solid #f0f0f0; font-size: 0.85rem; line-height: 1.5;
  }
  .ach-item:last-child { border-bottom: none; }
  .ach-num { color: #aaa; font-size: 0.75rem; padding-top: 2px; flex-shrink: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .full { grid-column: 1 / -1; }
  .error {
    background: #fee; border: 1px solid #fcc; border-radius: 8px;
    padding: 1rem; color: #c00; font-size: 0.85rem; margin-bottom: 1rem; display: none;
  }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } .full { grid-column: 1; } }
</style>
</head>
<body>
<div class="container">
  <h1>Resume Parser</h1>

  <div class="api-row">
    <input type="password" id="apiKey" placeholder="Enter your Groq API key (gsk_...)">
  </div>

  <div class="upload-area" id="uploadArea" onclick="document.getElementById('pdfInput').click()">
    <input type="file" id="pdfInput" accept=".pdf" onchange="handleFileSelect(event)">
    <label>📄 Click to upload your resume PDF</label>
    <div class="file-name" id="fileName"></div>
  </div>

  <button id="parseBtn" onclick="parseResume()">Extract Info →</button>
  <div class="status" id="status"></div>
  <div class="error" id="errorBox"></div>

  <div class="results" id="results">
    <div class="card">
      <div class="card-label">Name</div>
      <div class="name" id="resName">—</div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-label">CGPA / GPA</div>
        <div class="cgpa-val" id="resCgpa">—</div>
        <div style="font-size:0.8rem;color:#999;margin-top:4px;" id="resCgpaScale"></div>
      </div>
      <div class="card">
        <div class="card-label">Profile Links</div>
        <div class="url-list" id="resUrls"></div>
      </div>
      <div class="card full">
        <div class="card-label">Skills</div>
        <div class="skills-wrap" id="resSkills"></div>
      </div>
      <div class="card full">
        <div class="card-label">Achievements &amp; Certifications</div>
        <div class="ach-list" id="resAch"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // Set PDF.js worker
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let selectedFile = null;

  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    selectedFile = file;
    document.getElementById('fileName').textContent = '✓ ' + file.name;
  }

  // Drag and drop support
  const uploadArea = document.getElementById('uploadArea');
  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#555'; });
  uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#ccc'; });
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.style.borderColor = '#ccc';
    const file = e.dataTransfer.files[0];
    if (file && file.type === 'application/pdf') {
      selectedFile = file;
      document.getElementById('fileName').textContent = '✓ ' + file.name;
    } else {
      showError('Please drop a PDF file.');
    }
  });

  async function extractTextFromPDF(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const pageText = content.items.map(item => item.str).join(' ');
      fullText += pageText + '\n';
    }
    return fullText.trim();
  }

  async function parseResume() {
    const apiKey = document.getElementById('apiKey').value.trim();

    if (!apiKey) { showError('Please enter your Groq API key.'); return; }
    if (!selectedFile) { showError('Please upload a PDF resume.'); return; }

    const parseBtn = document.getElementById('parseBtn');
    parseBtn.disabled = true;
    document.getElementById('status').textContent = 'Extracting text from PDF…';
    document.getElementById('errorBox').style.display = 'none';
    document.getElementById('results').style.display = 'none';

    let resumeText = '';
    try {
      resumeText = await extractTextFromPDF(selectedFile);
      if (!resumeText) throw new Error('Could not extract text from PDF. It may be a scanned/image PDF.');
    } catch (e) {
      showError(e.message);
      parseBtn.disabled = false;
      document.getElementById('status').textContent = '';
      return;
    }

    document.getElementById('status').textContent = 'Analysing with Groq…';

    const SYSTEM = `You are a resume parser. Extract information and return ONLY valid JSON with no markdown, no code blocks, no extra text.

Return exactly this structure:
{
  "name": "Full name or null",
  "cgpa": "GPA/CGPA value as string or null",
  "cgpa_scale": "Scale like 4.0 or 10.0 or null",
  "skills": ["skill1", "skill2"],
  "urls": [{"label": "LinkedIn|GitHub|Portfolio|Other", "url": "https://..."}],
  "achievements": ["item1", "item2"]
}

achievements must include both achievements AND certifications combined.
If a field is not found, use null or an empty array.`;

    try {
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + apiKey
        },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          messages: [
            { role: "system", content: SYSTEM },
            { role: "user", content: "Parse this resume:\n\n" + resumeText }
          ],
          temperature: 0,
          max_tokens: 1500
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error?.message || `API error ${res.status}`);
      }

      const data = await res.json();
      const raw = data.choices?.[0]?.message?.content || '';
      const cleaned = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(cleaned);
      renderResults(parsed);
    } catch (e) {
      showError(e.message || 'Something went wrong.');
    } finally {
      parseBtn.disabled = false;
      document.getElementById('status').textContent = '';
    }
  }

  function renderResults(d) {
    document.getElementById('resName').textContent = d.name || 'Not found';

    document.getElementById('resCgpa').textContent = d.cgpa || '—';
    document.getElementById('resCgpaScale').textContent = d.cgpa_scale ? 'out of ' + d.cgpa_scale : '';

    const skillsEl = document.getElementById('resSkills');
    skillsEl.innerHTML = d.skills?.length
      ? d.skills.map(s => `<span class="pill">${s}</span>`).join('')
      : '<span style="color:#aaa;font-size:0.85rem;">No skills found</span>';

    const urlsEl = document.getElementById('resUrls');
    if (d.urls?.length) {
      urlsEl.innerHTML = d.urls.map(u => {
        const label = (u.label || '').toLowerCase();
        const cls = label.includes('linkedin')  ? 'badge-linkedin'
                  : label.includes('github')    ? 'badge-github'
                  : label.includes('portfolio') ? 'badge-portfolio'
                  : 'badge-other';
        return `<a class="url-item" href="${u.url}" target="_blank">
          <span class="badge ${cls}">${u.label}</span>${u.url}
        </a>`;
      }).join('');
    } else {
      urlsEl.innerHTML = '<span style="color:#aaa;font-size:0.85rem;">No URLs found</span>';
    }

    const achEl = document.getElementById('resAch');
    if (d.achievements?.length) {
      achEl.innerHTML = d.achievements.map((a, i) =>
        `<div class="ach-item">
          <span class="ach-num">${String(i+1).padStart(2,'0')}</span>
          <span>${a}</span>
        </div>`
      ).join('');
    } else {
      achEl.innerHTML = '<span style="color:#aaa;font-size:0.85rem;">None found</span>';
    }

    document.getElementById('results').style.display = 'block';
  }

  function showError(msg) {
    const el = document.getElementById('errorBox');
    el.textContent = msg;
    el.style.display = 'block';
  }
</script>
</body>
</html>
