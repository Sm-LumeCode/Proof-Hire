<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ProofHire · Skill Graph</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --surface2: #1a1e2a;
    --border: rgba(255,255,255,0.07);
    --text: #e8eaf0;
    --muted: #7a7f94;
    --matched: #00d68f;
    --matched-dim: rgba(0,214,143,0.15);
    --missing: #ff4d6d;
    --missing-dim: rgba(255,77,109,0.15);
    --extra: #4d9fff;
    --extra-dim: rgba(77,159,255,0.15);
    --domain: #5c6280;
    --domain-dim: rgba(92,98,128,0.12);
    --gap-edge: #ff4d6d;
    --norm-edge: rgba(255,255,255,0.12);
    --accent: #7c5cfc;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 300px 1fr;
    grid-template-areas: "header header" "sidebar canvas";
  }

  /* ── Header ── */
  header {
    grid-area: header;
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .fit-badge {
    display: flex; align-items: center; gap: 12px;
  }
  .fit-score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 28px; font-weight: 500;
    color: var(--missing);
  }
  .fit-score.good { color: var(--matched); }
  .fit-score.partial { color: #ffb347; }
  .fit-grade {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); font-family: 'IBM Plex Mono', monospace;
  }

  /* ── Sidebar ── */
  aside {
    grid-area: sidebar;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 20px;
  }

  .section-title {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 10px;
  }

  /* stat row */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat-card {
    background: var(--surface2); border-radius: 8px; padding: 10px 8px;
    text-align: center; border: 1px solid var(--border);
  }
  .stat-num { font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
  .stat-num.green { color: var(--matched); }
  .stat-num.red { color: var(--missing); }
  .stat-num.blue { color: var(--extra); }
  .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* legend */
  .legend { display: flex; flex-direction: column; gap: 8px; }
  .leg-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .leg-line { width: 24px; height: 2px; flex-shrink: 0; }

  /* gaps list */
  .gap-list { display: flex; flex-direction: column; gap: 8px; }
  .gap-item {
    background: var(--surface2); border-radius: 8px; padding: 10px 12px;
    border-left: 3px solid var(--missing);
  }
  .gap-item.medium { border-left-color: #ffb347; }
  .gap-item.low { border-left-color: var(--extra); }
  .gap-name { font-size: 13px; font-weight: 600; }
  .gap-meta { font-size: 11px; color: var(--muted); margin-top: 4px; font-family: 'IBM Plex Mono', monospace; }
  .gap-bar-wrap { background: rgba(255,255,255,0.06); border-radius: 3px; height: 3px; margin-top: 8px; }
  .gap-bar { height: 3px; border-radius: 3px; background: var(--missing); }
  .gap-item.medium .gap-bar { background: #ffb347; }
  .gap-item.low .gap-bar { background: var(--extra); }

  /* learning path */
  .path-chain { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .path-node {
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    background: var(--surface2); border: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
  }
  .path-arrow { color: var(--muted); font-size: 11px; }

  /* tooltip */
  #tooltip {
    position: fixed; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; pointer-events: none;
    opacity: 0; transition: opacity 0.15s; z-index: 100;
    min-width: 180px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #tooltip .tip-name { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  #tooltip .tip-status {
    display: inline-block; font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase; padding: 2px 7px; border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace; margin-bottom: 10px;
  }
  #tooltip .tip-row { display: flex; justify-content: space-between; gap: 20px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  #tooltip .tip-row span:last-child { font-family: 'IBM Plex Mono', monospace; color: var(--text); }
  
  .job-role-node {
    filter: drop-shadow(0 0 15px var(--accent));
  }

  /* canvas area */
  #canvas-wrap {
    grid-area: canvas; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 60% 40%, rgba(124,92,252,0.04) 0%, transparent 70%);
  }
  canvas { display: block; }

  /* controls */
  #controls {
    position: absolute; bottom: 16px; right: 16px;
    display: flex; gap: 6px;
  }
  .ctrl-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 16px;
    transition: background 0.15s;
  }
  .ctrl-btn:hover { background: var(--surface2); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .narrative {
    font-size: 12px; color: var(--muted); line-height: 1.7;
    padding: 10px 12px; background: var(--surface2); border-radius: 8px;
    border: 1px solid var(--border);
  }
</style>
</head>

  <div>

</aside>

</div>

document.getElementById('s-extra').textContent = expl.extra_count;
document.getElementById('narrative').textContent = expl.narrative;

// gaps
const gapList = document.getElementById('gap-list');
const gapColors = ['', 'medium', 'low'];
DATA.gap_analysis.gaps.forEach((g, i) => {
  const cls = gapColors[i] || 'low';
  const pct = Math.round(g.gap_priority * 100);
  gapList.innerHTML += `
    <div class="gap-item ${cls}">
      <div class="gap-name">${g.skill}</div>
      <div class="gap-meta">Priority ${pct}%</div>
      <div class="gap-bar-wrap"><div class="gap-bar" style="width:${pct}%"></div></div>
    </div>`;
});

// learning path (longest gap path)
const longestPath = DATA.gap_analysis.gaps.reduce((a,b) => b.learning_path.length > a.learning_path.length ? b : a).learning_path;
const pathEl = document.getElementById('path-chain');
longestPath.forEach((n, i) => {
  pathEl.innerHTML += `<span class="path-node">${n}</span>`;
  if (i < longestPath.length - 1) pathEl.innerHTML += `<span class="path-arrow">→</span>`;
});

// ── Canvas graph ──────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

const COLOR = { MATCHED:'#00d68f', MISSING:'#ff4d6d', EXTRA:'#4d9fff', DOMAIN:'#3d4260', JOB_ROLE: '#7c5cfc' };
const STROKE_C = { MATCHED:'#00a86b', MISSING:'#cc1f3e', EXTRA:'#1a6fcc', DOMAIN:'#5c6280', JOB_ROLE: '#fff' };


// ── Radial Layout Calculation ────────────────────────────────────────
function calculateLayout() {
  const centerX = 0.5, centerY = 0.5;
  const coreEdges = edges.filter(e => e.source === 'Backend Developer' || e.target === 'Backend Developer');
  const coreIds = new Set(coreEdges.map(e => e.source === 'Backend Developer' ? e.target : e.source));
  
  // Center
  const roleNode = byId['Backend Developer'];
  if (roleNode) { roleNode.px = centerX; roleNode.py = centerY; }

  // Level 1: Core Skills
  const coreNodes = nodes.filter(n => coreIds.has(n.id));
  coreNodes.forEach((n, i) => {
    const angle = (i / coreNodes.length) * Math.PI * 2;
    const r = 0.22;
    n.px = centerX + Math.cos(angle) * r;
    n.py = centerY + Math.sin(angle) * r;
  });

  // Level 2: Connected to Core
  const level1Ids = new Set(coreNodes.map(n => n.id));
  const level2Nodes = nodes.filter(n => {
    if (n.status === 'JOB_ROLE' || level1Ids.has(n.id)) return false;
    return edges.some(e => (level1Ids.has(e.source) && e.target === n.id) || (level1Ids.has(e.target) && e.source === n.id));
  });
  level2Nodes.forEach((n, i) => {
    const angle = (i / level2Nodes.length) * Math.PI * 2 + 0.2;
    const r = 0.38;
    n.px = centerX + Math.cos(angle) * r;
    n.py = centerY + Math.sin(angle) * r;
  });

  // Level 3: Everything else
  const placedIds = new Set([...coreIds, ...level2Nodes.map(n => n.id), 'Backend Developer']);
  const remaining = nodes.filter(n => !placedIds.has(n.id));
  remaining.forEach((n, i) => {
    const angle = (i / remaining.length) * Math.PI * 2 - 0.1;
    const r = 0.46;
    n.px = centerX + Math.cos(angle) * r;
    n.py = centerY + Math.sin(angle) * r;
  });
}

// Build node map
const byId = {};
const nodes = DATA.graph.nodes.map(n => {
  const obj = { ...n, px: 0.5, py: 0.5 };
  byId[n.id] = obj;
  return obj;
});
const edges = DATA.graph.edges;
calculateLayout();

// Viewport transform
let scale = 1, tx = 0, ty = 0;
let dragging = false, lastX, lastY;
let W, H;
let dashOffset = 0;

function resize() {
  const r = wrap.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(devicePixelRatio, devicePixelRatio);
  draw();
}
window.addEventListener('resize', resize);

function nodeRadius(n) { 
    if (n.status === 'JOB_ROLE') return 45;
    return Math.max(10, 8 + Math.sqrt(n.downstream_count) * 3); 
}

function toScreen(nx, ny) {
  return [nx * W * scale + tx, ny * H * scale + ty];
}

let hoveredNode = null;

function draw() {
  ctx.clearRect(0, 0, W, H);

  // grid dots
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let gx = 0; gx < W; gx += 40) for (let gy = 0; gy < H; gy += 40) {
    ctx.beginPath(); ctx.arc(gx, gy, 1, 0, Math.PI*2); ctx.fill();
  }

  // edges
  edges.forEach(e => {
    const a = byId[e.source], b = byId[e.target];
    if (!a || !b) return;
    const [ax, ay] = toScreen(a.px, a.py);
    const [bx, by] = toScreen(b.px, b.py);

    const isRelated = !hoveredNode || hoveredNode.id === e.source || hoveredNode.id === e.target;
    const opacityMult = isRelated ? 1 : 0.15;

    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    
    ctx.setLineDash([3, 3]);
    ctx.lineDashOffset = -dashOffset;
    if (e.edge_type === 'CORE_REQUIREMENT') {
        ctx.strokeStyle = e.is_gap_path ? `rgba(255,77,109,${0.7 * opacityMult})` : `rgba(124,92,252,${0.5 * opacityMult})`;
        ctx.lineWidth = 1.5;
    } else {
        ctx.strokeStyle = e.is_gap_path ? `rgba(255,77,109,${0.5 * opacityMult})` : `rgba(255,255,255,${0.08 * opacityMult})`;
        ctx.lineWidth = 0.8;
    }
    
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;

    // arrowhead
    const rb = nodeRadius(b) * scale;
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
    if (len < 1) return;
    const ex = bx - dx/len * (rb + 2), ey = by - dy/len * (rb + 2);
    const aw = 4, ah = dx/len * 4;
    ctx.beginPath();
    ctx.moveTo(ex - dx/len * 8 + (-dy/len * aw), ey - dy/len * 8 + (dx/len * aw));
    ctx.lineTo(ex, ey);
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - dx/len * 8 - (-dy/len * aw), ey - dy/len * 8 - (dx/len * aw));
    ctx.strokeStyle = e.is_gap_path ? 'rgba(255,77,109,0.7)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // nodes
  nodes.forEach(n => {
    const [sx, sy] = toScreen(n.px, n.py);
    const r = nodeRadius(n) * scale;
    const isH = hoveredNode && hoveredNode.id === n.id;

    // glow for key nodes
    if (n.status === 'MATCHED' || n.status === 'MISSING' || n.status === 'JOB_ROLE') {
      ctx.beginPath();
      ctx.arc(sx, sy, r + (n.status === 'JOB_ROLE' ? 15 : 8) * scale, 0, Math.PI*2);
      const grd = ctx.createRadialGradient(sx,sy,r*0.5,sx,sy,r+(n.status === 'JOB_ROLE' ? 15 : 8)*scale);
      let c = n.status === 'MATCHED' ? '0,214,143' : '255,77,109';
      if (n.status === 'JOB_ROLE') c = '124,92,252';
      grd.addColorStop(0, `rgba(${c},0.3)`);
      grd.addColorStop(1, `rgba(${c},0)`);
      ctx.fillStyle = grd;
      ctx.fill();
    }

    if (isH) {
      ctx.beginPath();
      ctx.arc(sx, sy, r + 6 * scale, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI*2);
    ctx.fillStyle = COLOR[n.status] || '#3d4260';
    ctx.fill();
    ctx.strokeStyle = isH ? '#fff' : (STROKE_C[n.status] || '#5c6280');
    ctx.lineWidth = isH ? 2 : 0.8;
    ctx.stroke();

    // label
    const fontSize = Math.max(9, Math.min(13, 11 * scale));
    const isRelated = !hoveredNode || hoveredNode.id === n.id || edges.some(e => (e.source === n.id && e.target === hoveredNode.id) || (e.target === n.id && e.source === hoveredNode.id));
    const labelOpacity = isRelated ? 1 : 0.3;

    ctx.font = `${n.status === 'MATCHED' || n.status === 'MISSING' ? '600' : '400'} ${fontSize}px 'IBM Plex Mono',monospace`;
    ctx.textAlign = 'center';
    const labelY = sy + r + 4 * scale + fontSize;
    const tw = ctx.measureText(n.label).width;
    ctx.fillStyle = `rgba(13,15,20,${0.75 * labelOpacity})`;
    ctx.fillRect(sx - tw/2 - 3, labelY - fontSize, tw + 6, fontSize + 2);
    
    let baseColor = n.status === 'DOMAIN' ? 'rgba(200,204,220,0.5)' : 'rgba(200,204,220,0.85)';
    if (isH) baseColor = COLOR[n.status];
    
    ctx.fillStyle = baseColor.replace(/[\d.]+\)$/, `${labelOpacity})`);
    ctx.fillText(n.label, sx, labelY);
  });
}

function animate() {
    dashOffset += 0.2;
    draw();
    requestAnimationFrame(animate);
}
animate();

// hover
function getNode(mx, my) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const [sx, sy] = toScreen(n.px, n.py);
    const r = nodeRadius(n) * scale;
    if (Math.hypot(mx - sx, my - sy) <= r + 4) return n;
  }
  return null;
}

const tip = document.getElementById('tooltip');
const statusLabel = { MATCHED: '✓ Matched', MISSING: '✗ Missing', EXTRA: '+ Extra', DOMAIN: '◦ Context', JOB_ROLE: '🎯 Target Role' };
const statusBg = { MATCHED: 'rgba(0,214,143,0.15)', MISSING: 'rgba(255,77,109,0.15)', EXTRA: 'rgba(77,159,255,0.15)', DOMAIN: 'rgba(92,98,128,0.15)', JOB_ROLE: 'rgba(124,92,252,0.15)' };
const statusColor = { MATCHED: '#00d68f', MISSING: '#ff4d6d', EXTRA: '#4d9fff', DOMAIN: '#7a7f94', JOB_ROLE: '#7c5cfc' };

canvas.addEventListener('mousemove', ev => {
  const r = canvas.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const n = getNode(mx, my);
  hoveredNode = n;
  draw();
  if (n) {
    canvas.style.cursor = 'pointer';
    tip.style.opacity = '1';
    let lx = ev.clientX + 16, ly = ev.clientY - 10;
    if (lx + 240 > window.innerWidth) lx = ev.clientX - 260;
    tip.style.left = lx + 'px'; tip.style.top = ly + 'px';
    const sl = statusLabel[n.status] || n.status;
    const sc = statusColor[n.status] || '#7a7f94';
    const sbg = statusBg[n.status] || 'rgba(92,98,128,0.15)';
    
    if (n.status === 'JOB_ROLE') {
        tip.innerHTML = `
          <div class="tip-name" style="font-size:16px; font-weight:700; color:var(--accent); margin-bottom:10px;">Backend Developer</div>
          <div class="tip-row" style="display:flex; justify-content:space-between; font-size:18px; font-weight:700; margin-bottom:4px;">
            <span>🏆 OVERALL FIT:</span>
            <span style="font-family:'IBM Plex Mono'; color:var(--matched);">${Math.round(n.fit_score_val * 100)}%</span>
          </div>
          <div style="font-size:11px; color:var(--muted); margin-top:8px;">Calculated based on core requirements and skill matches.</div>
        `;
    } else if (n.status === 'EXTRA') {
        const neighbors = edges.filter(e => e.source === n.id || e.target === n.id);
        const similar = neighbors.length > 0 ? (neighbors[0].source === n.id ? neighbors[0].target : neighbors[0].source) : 'N/A';
        tip.innerHTML = `
            <div class="tip-name" style="font-size:14px; font-weight:700; margin-bottom:4px;">Bonus Skill: ${n.label}</div>
            <div style="font-size:12px; color:var(--text);">Most similar to: ${similar.toLowerCase()} (sim: 0.82)</div>
        `;
    } else {
        const m = n.github_metrics || { total_repos: 0, total_stars: 0, deployed_apps: false };
        tip.innerHTML = `
          <div class="tip-name" style="font-size:14px; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:8px;">
            ${n.label}
          </div>
          <div style="border-bottom:1px dashed var(--border); margin: 6px 0;"></div>
          <div class="tip-row" style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
            <span>🎯 Skill Match:</span>
            <span style="font-family:'IBM Plex Mono'; font-weight:600;">${n.skill_match}/100</span>
          </div>
          <div class="tip-row" style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
            <span>💻 GitHub Project Evidence:</span>
            <span style="font-family:'IBM Plex Mono'; font-weight:600;">${n.github_evidence}/100</span>
          </div>
          <div style="font-size:10px; color:var(--muted); margin-bottom:12px;">(Calculated w/ higher 35% edge)</div>
          
          <div style="font-size:11px; font-weight:700; color:var(--text); margin-bottom:6px;">GitHub Metrics:</div>
          <div class="tip-row" style="display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:2px;">
            <span>• Total Repos:</span>
            <span style="color:var(--text);">${m.total_repos}</span>
          </div>
          <div class="tip-row" style="display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:2px;">
            <span>• Total Stars:</span>
            <span style="color:var(--text);">${m.total_stars}</span>
          </div>
          <div class="tip-row" style="display:flex; justify-content:space-between; font-size:11px; color:var(--muted);">
            <span>• Deployed Apps:</span>
            <span style="color:var(--text);">${m.deployed_apps ? 'True' : 'False'}</span>
          </div>
        `;
    }
  } else {
    canvas.style.cursor = 'default';
    tip.style.opacity = '0';
  }
});
canvas.addEventListener('mouseleave', () => { hoveredNode = null; tip.style.opacity = '0'; draw(); });

// pan
canvas.addEventListener('mousedown', ev => { dragging = true; lastX = ev.clientX; lastY = ev.clientY; canvas.style.cursor = 'grab'; });
window.addEventListener('mouseup', () => { dragging = false; canvas.style.cursor = hoveredNode ? 'pointer' : 'default'; });
window.addEventListener('mousemove', ev => {
  if (!dragging) return;
  tx += ev.clientX - lastX; ty += ev.clientY - lastY;
  lastX = ev.clientX; lastY = ev.clientY;
  draw();
});

// zoom
canvas.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = canvas.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const delta = ev.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.min(4, Math.max(0.3, scale * delta));
  tx = mx - (mx - tx) * (newScale / scale);
  ty = my - (my - ty) * (newScale / scale);
  scale = newScale;
  draw();
}, { passive: false });

// touch pan
let lastTouch = null;
canvas.addEventListener('touchstart', ev => { if (ev.touches.length === 1) lastTouch = { x: ev.touches[0].clientX, y: ev.touches[0].clientY }; });
canvas.addEventListener('touchmove', ev => {
  ev.preventDefault();
  if (ev.touches.length === 1 && lastTouch) {
    tx += ev.touches[0].clientX - lastTouch.x;
    ty += ev.touches[0].clientY - lastTouch.y;
    lastTouch = { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
    draw();
  }
}, { passive: false });

// buttons
document.getElementById('btn-zoom-in').onclick = () => { scale = Math.min(4, scale * 1.2); draw(); };
document.getElementById('btn-zoom-out').onclick = () => { scale = Math.max(0.3, scale * 0.8); draw(); };
document.getElementById('btn-reset').onclick = () => { scale = 1; tx = 0; ty = 0; draw(); };

resize();
</script>
