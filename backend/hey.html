<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skill Evidence Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root {
    --bg: #08111f;
    --panel: #0f1b2d;
    --panel-soft: rgba(15, 27, 45, 0.82);
    --border: rgba(148, 163, 184, 0.14);
    --text: #e6edf6;
    --muted: #8aa0bd;
    --accent: #2dd4bf;
    --accent-2: #f59e0b;
    --good: #22c55e;
    --warn: #f97316;
    --bad: #ef4444;
    --related: #60a5fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    overflow: hidden;
    color: var(--text);
    font-family: "Segoe UI", Tahoma, sans-serif;
    background:
      radial-gradient(circle at top left, rgba(45, 212, 191, 0.16), transparent 28%),
      radial-gradient(circle at top right, rgba(245, 158, 11, 0.18), transparent 26%),
      linear-gradient(180deg, #07101c 0%, #091321 100%);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 24px 14px;
    display: flex;
    justify-content: space-between;
    gap: 18px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: rgba(8, 17, 31, 0.85);
    backdrop-filter: blur(10px);
  }
  .title-block h1 {
    font-size: 1rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #dbe7f6;
  }
  .title-block p {
    margin-top: 4px;
    color: var(--muted);
    font-size: 0.76rem;
  }
  .header-right {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .metric-pill {
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(15, 27, 45, 0.75);
    font-size: 0.76rem;
    color: var(--muted);
  }
  .metric-pill strong {
    color: var(--text);
    margin-left: 4px;
  }
  #score-display {
    color: var(--accent);
    border-color: rgba(45, 212, 191, 0.25);
  }
  .legend {
    padding: 10px 24px 0;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  #graph-wrap {
    position: relative;
    flex: 1;
    overflow: hidden;
    margin: 12px 16px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background:
      linear-gradient(180deg, rgba(15, 27, 45, 0.84), rgba(9, 19, 33, 0.96)),
      repeating-linear-gradient(
        0deg,
        rgba(148, 163, 184, 0.03),
        rgba(148, 163, 184, 0.03) 1px,
        transparent 1px,
        transparent 40px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(148, 163, 184, 0.03),
        rgba(148, 163, 184, 0.03) 1px,
        transparent 1px,
        transparent 40px
      );
  }
  svg { width: 100%; height: 100%; }
  #tooltip {
    position: absolute;
    width: min(320px, calc(100% - 24px));
    pointer-events: none;
    opacity: 0;
    z-index: 10;
    padding: 14px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--panel-soft);
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 45px rgba(2, 8, 23, 0.45);
    transition: opacity 0.15s ease;
    line-height: 1.45;
  }
  .tt-title {
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .tt-score {
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .tt-line {
    color: var(--muted);
    font-size: 0.76rem;
    margin-top: 4px;
  }
  .tt-tag-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .tt-tag {
    font-size: 0.68rem;
    color: #d6e4f4;
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid rgba(148, 163, 184, 0.14);
    background: rgba(148, 163, 184, 0.08);
  }
  .tt-repo-list {
    margin-top: 10px;
    display: grid;
    gap: 8px;
  }
  .tt-repo {
    padding: 8px 10px;
    border-radius: 12px;
    background: rgba(148, 163, 184, 0.06);
    border: 1px solid rgba(148, 163, 184, 0.08);
  }
  .tt-repo strong {
    display: block;
    color: #f8fafc;
    font-size: 0.76rem;
  }
  .tt-repo span {
    font-size: 0.7rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<header>
  <div class="title-block">
    <h1>Skill Evidence Graph</h1>
    <p>Hover a skill to inspect the fit rationale and GitHub-backed proof.</p>
  </div>
  <div class="header-right">
    <div class="metric-pill" id="score-display">Fit Score <strong>--</strong></div>
    <div class="metric-pill" id="matched-count">Matched <strong>0</strong></div>
    <div class="metric-pill" id="evidence-count">GitHub Evidence <strong>0</strong></div>
  </div>
</header>

<div class="legend">
  <div class="legend-item"><div class="dot" style="background:#f59e0b"></div>Role Center</div>
  <div class="legend-item"><div class="dot" style="background:#22c55e"></div>Strong Match</div>
  <div class="legend-item"><div class="dot" style="background:#60a5fa"></div>Related Transfer</div>
  <div class="legend-item"><div class="dot" style="background:#ef4444"></div>Gap</div>
  <div class="legend-item"><div class="dot" style="background:#2dd4bf"></div>Candidate Evidence</div>
</div>

<div id="graph-wrap">
  <svg id="graph"></svg>
  <div id="tooltip"></div>
</div>

<script>
const GRAPH_CONTEXT = __GRAPH_CONTEXT__;

function normalize(value) {
  return (value || '').toLowerCase().replace(/[^a-z0-9.#+\s]/g, '').trim();
}

// Removed queryLLM as implications are now handled by the backend.

function ngramVector(str, n = 3) {
  const s = ` ${str.toLowerCase()} `;
  const freq = {};
  for (let i = 0; i <= s.length - n; i++) {
    const gram = s.slice(i, i + n);
    freq[gram] = (freq[gram] || 0) + 1;
  }
  return freq;
}

function cosineSim(a, b) {
  const va = ngramVector(a);
  const vb = ngramVector(b);
  const keys = new Set([...Object.keys(va), ...Object.keys(vb)]);
  let dot = 0;
  let na = 0;
  let nb = 0;
  for (const key of keys) {
    dot += (va[key] || 0) * (vb[key] || 0);
    na += (va[key] || 0) ** 2;
    nb += (vb[key] || 0) ** 2;
  }
  return na && nb ? dot / (Math.sqrt(na) * Math.sqrt(nb)) : 0;
}

async function buildGraphData(context) {
  const candidateSkills = context.candidateSkills || [];
  const requiredSkills = context.requiredSkills || [];
  const apiKey = context.apiKey || '';
  const evidenceMap = context.evidenceMap || {};
  const implications = context.precalculatedImplications || {};
  const normReq = requiredSkills.map(normalize);

  const breakdown = [];
  for (let i = 0; i < requiredSkills.length; i++) {
    const req = requiredSkills[i];
    const normalizedReq = normReq[i];
    let best = { score: 0, reason: 'No direct or related evidence found yet.', match: null };

    for (const candidateSkill of candidateSkills) {
      const normalizedCandidate = normalize(candidateSkill);

      if (normalizedCandidate === normalizedReq) {
        best = { score: 1, reason: 'Direct skill match.', match: candidateSkill };
        break;
      }

      const implication = (implications[normalizedCandidate] || []).find(
        item => normalize(item.skill) === normalizedReq
      );
      if (implication && implication.confidence > best.score) {
        best = {
          score: implication.confidence,
          reason: implication.reason || 'Related technical evidence.',
          match: candidateSkill
        };
        continue;
      }

      const similarity = cosineSim(normalizedCandidate, normalizedReq);
      if (similarity >= 0.72 && similarity > best.score) {
        best = {
          score: similarity,
          reason: `Semantically similar skill (${(similarity * 100).toFixed(0)}%).`,
          match: candidateSkill
        };
      }
    }

    const relatedEvidence = best.match ? (evidenceMap[normalize(best.match)] || []) : [];
    breakdown.push({
      req,
      normalizedReq,
      score: best.score,
      reason: best.reason,
      match: best.match,
      githubEvidence: relatedEvidence
    });
  }

  const overall = requiredSkills.length
    ? breakdown.reduce((sum, item) => sum + item.score, 0) / requiredSkills.length * 100
    : 0;

  const nodes = [{ id: '__center__', label: 'ROLE', type: 'center' }];
  const links = [];
  const seenCandidate = new Set();

  for (const item of breakdown) {
    const type = item.score >= 0.75 ? 'matched' : item.score >= 0.4 ? 'related' : 'gap';
    nodes.push({
      id: item.normalizedReq,
      label: item.req,
      type,
      score: item.score,
      reason: item.reason,
      matchedWith: item.match,
      githubEvidence: item.githubEvidence
    });
    links.push({ source: '__center__', target: item.normalizedReq, type: 'center-req' });
  }

  for (const candidateSkill of candidateSkills) {
    const normalizedCandidate = normalize(candidateSkill);
    const evidence = evidenceMap[normalizedCandidate] || [];
    const candidateImplications = implications[normalizedCandidate] || [];
    const connectedRequirements = new Set();

    for (const item of candidateImplications) {
      const normalizedReq = normalize(item.skill);
      if (normReq.includes(normalizedReq)) {
        connectedRequirements.add(normalizedReq);
        links.push({
          source: normalizedCandidate,
          target: normalizedReq,
          type: 'implication',
          confidence: item.confidence,
          reason: item.reason
        });
      }
    }

    const exactRequirement = requiredSkills.find(req => normalize(req) === normalizedCandidate);
    if (exactRequirement) {
      connectedRequirements.add(normalizedCandidate);
    }

    if (connectedRequirements.size || evidence.length) {
      if (!seenCandidate.has(normalizedCandidate)) {
        nodes.push({
          id: normalizedCandidate,
          label: candidateSkill,
          type: 'candidate',
          githubEvidence: evidence
        });
        seenCandidate.add(normalizedCandidate);
      }
    }
  }

  return { nodes, links, overall, breakdown };
}

const COLOR = {
  center: '#f59e0b',
  matched: '#22c55e',
  related: '#60a5fa',
  gap: '#ef4444',
  candidate: '#2dd4bf'
};

const GLOW = {
  center: 'rgba(245, 158, 11, 0.35)',
  matched: 'rgba(34, 197, 94, 0.28)',
  related: 'rgba(96, 165, 250, 0.24)',
  gap: 'rgba(239, 68, 68, 0.28)',
  candidate: 'rgba(45, 212, 191, 0.22)'
};

const RADIUS = {
  center: 42,
  matched: 28,
  related: 24,
  gap: 24,
  candidate: 19
};

function tooltipHtml(node) {
  const repoEvidence = (node.githubEvidence || []).slice(0, 3);
  let html = `<div class="tt-title" style="color:${COLOR[node.type]}">${node.label}</div>`;

  if (node.score !== undefined && node.score !== null) {
    html += `<div class="tt-score" style="color:${COLOR[node.type]}">${(node.score * 100).toFixed(1)}% fit</div>`;
  }

  if (node.matchedWith) {
    html += `<div class="tt-line">Matched through <strong style="color:#f8fafc">${node.matchedWith}</strong></div>`;
  }

  if (node.reason) {
    html += `<div class="tt-line">${node.reason}</div>`;
  }

  if (repoEvidence.length) {
    html += `<div class="tt-tag-row"><div class="tt-tag">GitHub evidence: ${repoEvidence.length}+ repos</div></div>`;
    html += '<div class="tt-repo-list">';
    for (const repo of repoEvidence) {
      const summaryParts = [];
      if (repo.match_type) summaryParts.push(repo.match_type);
      if (repo.language) summaryParts.push(repo.language);
      if (typeof repo.stars === 'number') summaryParts.push(`${repo.stars} stars`);
      html += `
        <div class="tt-repo">
          <strong>${repo.name || repo.full_name || 'Repository'}</strong>
          <span>${summaryParts.join(' • ') || 'Evidence from GitHub profile'}</span>
        </div>
      `;
    }
    html += '</div>';
  } else if (node.type === 'candidate') {
    html += '<div class="tt-line">No GitHub repo evidence attached to this skill yet.</div>';
  }

  if (node.type === 'gap') {
    html += '<div class="tt-line" style="color:#fca5a5">This is a visible hiring gap for the role.</div>';
  }

  return html;
}

function renderGraph(data) {
  const { nodes, links, overall, breakdown } = data;
  document.querySelector('#score-display strong').textContent = `${overall.toFixed(1)} / 100`;
  document.querySelector('#matched-count strong').textContent = `${breakdown.filter(item => item.score >= 0.75).length}`;
  document.querySelector('#evidence-count strong').textContent = `${breakdown.filter(item => (item.githubEvidence || []).length).length}`;

  const wrap = document.getElementById('graph-wrap');
  const width = wrap.clientWidth;
  const height = wrap.clientHeight;
  d3.select('#graph').selectAll('*').remove();

  const svg = d3.select('#graph').attr('viewBox', `0 0 ${width} ${height}`);
  const defs = svg.append('defs');

  for (const [type, glow] of Object.entries(GLOW)) {
    const filter = defs.append('filter')
      .attr('id', `glow-${type}`)
      .attr('x', '-50%')
      .attr('y', '-50%')
      .attr('width', '200%')
      .attr('height', '200%');
    filter.append('feGaussianBlur').attr('stdDeviation', '7').attr('result', 'blur');
    filter.append('feFlood').attr('flood-color', glow).attr('result', 'color');
    filter.append('feComposite').attr('in', 'color').attr('in2', 'blur').attr('operator', 'in').attr('result', 'shadow');
    const merge = filter.append('feMerge');
    merge.append('feMergeNode').attr('in', 'shadow');
    merge.append('feMergeNode').attr('in', 'SourceGraphic');
  }

  defs.append('marker')
    .attr('id', 'arrow')
    .attr('viewBox', '0 -4 8 8')
    .attr('refX', 8)
    .attr('refY', 0)
    .attr('markerWidth', 6)
    .attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,-4L8,0L0,4')
    .attr('fill', 'rgba(138,160,189,0.7)');

  const graph = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.35, 3]).on('zoom', event => graph.attr('transform', event.transform)));

  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(node => node.id).distance(link => link.type === 'center-req' ? 170 : 118).strength(0.92))
    .force('charge', d3.forceManyBody().strength(-430))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(node => RADIUS[node.type] + 22));

  const link = graph.append('g')
    .selectAll('line')
    .data(links)
    .enter()
    .append('line')
    .attr('stroke', d => d.type === 'implication' ? 'rgba(45,212,191,0.4)' : 'rgba(245,158,11,0.18)')
    .attr('stroke-width', d => d.type === 'implication' ? 1.6 : 1.1)
    .attr('stroke-dasharray', d => d.type === 'implication' ? '5,4' : null)
    .attr('marker-end', d => d.type === 'implication' ? 'url(#arrow)' : null);

  const node = graph.append('g')
    .selectAll('g')
    .data(nodes)
    .enter()
    .append('g')
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (event, d) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      })
      .on('drag', (event, d) => {
        d.fx = event.x;
        d.fy = event.y;
      })
      .on('end', (event, d) => {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }));

  node.append('circle')
    .attr('r', d => RADIUS[d.type] + 10)
    .attr('fill', d => GLOW[d.type])
    .attr('opacity', 0.66);

  node.append('circle')
    .attr('r', d => RADIUS[d.type])
    .attr('fill', d => d.type === 'center' ? '#132237' : '#0b1526')
    .attr('stroke', d => COLOR[d.type])
    .attr('stroke-width', d => d.type === 'center' ? 3.1 : 2.2)
    .style('filter', d => `url(#glow-${d.type})`);

  node.append('text')
    .text(d => d.label)
    .attr('text-anchor', 'middle')
    .attr('dy', '0.35em')
    .attr('fill', d => d.type === 'center' ? '#f8fafc' : COLOR[d.type])
    .attr('font-size', d => {
      if (d.type === 'center') return '11px';
      if (d.label.length > 12) return '7.8px';
      if (d.label.length > 9) return '8.6px';
      return '9.4px';
    })
    .attr('font-weight', '700')
    .attr('letter-spacing', '0.05em');

  node.filter(d => d.score !== undefined && d.score !== null)
    .append('text')
    .text(d => `${(d.score * 100).toFixed(0)}%`)
    .attr('text-anchor', 'middle')
    .attr('dy', d => RADIUS[d.type] + 15)
    .attr('fill', d => COLOR[d.type])
    .attr('font-size', '8px')
    .attr('font-weight', '700')
    .attr('opacity', 0.9);

  const tooltip = document.getElementById('tooltip');
  node.on('mouseover', (event, d) => {
    if (d.type === 'center') {
      tooltip.style.opacity = '0';
      return;
    }
    tooltip.innerHTML = tooltipHtml(d);
    tooltip.style.opacity = '1';
  }).on('mousemove', event => {
    const rect = wrap.getBoundingClientRect();
    let x = event.clientX - rect.left + 14;
    let y = event.clientY - rect.top - 14;
    if (x + 336 > rect.width) x -= 350;
    if (y + 220 > rect.height) y -= 180;
    tooltip.style.left = `${x}px`;
    tooltip.style.top = `${y}px`;
  }).on('mouseout', () => {
    tooltip.style.opacity = '0';
  });

  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => {
        const dx = d.target.x - d.source.x;
        const dy = d.target.y - d.source.y;
        const distance = Math.sqrt(dx * dx + dy * dy) || 1;
        return d.target.x - (dx / distance) * (RADIUS[d.target.type] + 8);
      })
      .attr('y2', d => {
        const dx = d.target.x - d.source.x;
        const dy = d.target.y - d.source.y;
        const distance = Math.sqrt(dx * dx + dy * dy) || 1;
        return d.target.y - (dy / distance) * (RADIUS[d.target.type] + 8);
      });

    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

async function runGraph() {
  const data = await buildGraphData(GRAPH_CONTEXT);
  renderGraph(data);
}

window.addEventListener('load', () => {
  runGraph().catch(error => {
    console.error(error);
    document.querySelector('#score-display strong').textContent = 'Error';
  });
});
</script>
</body>
</html>
